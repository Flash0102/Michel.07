<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analytics Operations Hub</title>
<style>
:root{--bg:#07110d;--panel:#0f2118;--line:#234333;--txt:#f4f7f5;--muted:#93a89d;--green:#4ade80;--blue:#60a5fa;--yellow:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07110d,#0c1d15);color:var(--txt);font-family:Arial,sans-serif}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{padding:26px 18px;border-right:1px solid var(--line);background:#08150f}.brand{font-size:22px;font-weight:800}.brand span{color:var(--green)}.side p{font-size:12px;color:var(--muted);line-height:1.5}.nav{margin-top:30px;display:grid;gap:8px}.nav div{padding:11px 12px;border-radius:10px;color:var(--muted)}.nav .on{background:#153522;color:#fff}.main{padding:30px}.eyebrow{color:var(--green);font-size:12px;font-weight:bold;letter-spacing:.12em}.main h1{font-size:34px;margin:8px 0}.sub{color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.kpi,.card,.detail{background:var(--panel);border:1px solid var(--line);border-radius:16px}.kpi{padding:18px}.kpi small{color:var(--muted)}.kpi b{font-size:30px;display:block;margin-top:7px}.toolbar{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.search{flex:1;min-width:240px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#091710;color:#fff}.filter{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:#0b1a12;color:var(--muted);cursor:pointer}.filter.on{background:#194b2e;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:17px;cursor:pointer}.card:hover{border-color:#3a7952}.top{display:flex;justify-content:space-between}.n{width:38px;height:38px;border-radius:10px;background:#173c28;display:grid;place-items:center;color:var(--green);font-weight:bold}.status{font-size:10px;font-weight:bold;padding:6px 9px;border-radius:999px;background:#123d25;color:#85efae;height:max-content}.status.att{background:#493b16;color:#ffe184}.status.pil{background:#173456;color:#a8d2ff}.card h3{margin:14px 0 7px}.card p{color:var(--muted);font-size:12px;line-height:1.55;min-height:56px}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:9px;border:1px solid var(--line);padding:4px 6px;border-radius:6px;color:#b7c9bf}.detail{display:none;margin-top:16px;padding:20px}.detail.show{display:block}.detail p{color:var(--muted);font-size:13px;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.action{padding:9px 11px;border-radius:9px;background:#153522;font-size:11px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.main{padding:18px}.kpis,.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="app"><aside class="side"><div class="brand">Analytics <span>Hub</span></div><p>Central demonstrativa de projetos, dados e automações.</p><div class="nav"><div class="on">Visão geral</div><div>Projetos</div><div>Automações</div><div>Dashboards</div><div>Governança</div></div></aside><main class="main"><div class="eyebrow">DATA & AUTOMATION PORTFOLIO</div><h1>Analytics Operations Hub</h1><div class="sub">Indicadores, projetos e ações em uma única interface demonstrativa.</div><section class="kpis"><div class="kpi"><small>Projetos</small><b>6</b></div><div class="kpi"><small>Rotinas ativas</small><b>4</b></div><div class="kpi"><small>Alertas</small><b>1</b></div><div class="kpi"><small>Fontes</small><b>5</b></div></section><div class="toolbar"><input id="q" class="search" placeholder="Buscar projeto ou tecnologia..."><button class="filter on" data-f="all">Todos</button><button class="filter" data-f="analytics">Analytics</button><button class="filter" data-f="automation">Automação</button><button class="filter" data-f="app">Apps</button></div><section id="grid" class="grid"></section><section id="detail" class="detail"></section></main></div>
<script>
const P=[
{id:'ruptura',n:'01',name:'Ruptura & Estoque',cat:['analytics','automation'],status:'Ativo',cls:'',desc:'Cobertura, criticidade, estoque e priorização automática.',stack:['SQL','Apps Script','Power BI'],actions:['Validar itens críticos','Atualizar indicadores','Gerar resumo']},
{id:'validade',n:'02',name:'Controle de Validade',cat:['analytics','automation'],status:'Atenção',cls:'att',desc:'Risco de vencimento, valor exposto e ranking de prioridade.',stack:['Sheets','Apps Script','KPIs'],actions:['Revisar críticos','Priorizar ação','Registrar tratativa']},
{id:'caixas',n:'03',name:'Controle de Caixas',cat:['analytics','automation'],status:'Ativo',cls:'',desc:'Saldo, movimentação, inatividade e valor financeiro.',stack:['Athena','DAX','Power BI'],actions:['Revisar inativos','Validar saldo','Gerar fila de ação']},
{id:'cadastro',n:'04',name:'Cadastro de Produtos',cat:['app','automation'],status:'Piloto',cls:'pil',desc:'Interface para solicitações, status, calendário e governança.',stack:['HTML','Apps Script','Sheets'],actions:['Revisar fila','Validar cadastro','Publicar atualização']},
{id:'mix',n:'05',name:'Performance de Mix',cat:['analytics'],status:'Ativo',cls:'',desc:'Giro, cobertura e oportunidades de otimização de sortimento.',stack:['Power BI','DAX','SQL'],actions:['Analisar baixo giro','Cruzar cobertura','Definir ação']},
{id:'exec',n:'06',name:'Relatório Executivo',cat:['app','analytics'],status:'Ativo',cls:'',desc:'KPIs, rankings, alertas e decisões em visão consolidada.',stack:['HTML','BI','Automation'],actions:['Consolidar KPIs','Gerar briefing','Compartilhar decisão']}
];let f='all';const grid=document.getElementById('grid'),detail=document.getElementById('detail'),q=document.getElementById('q');function render(){let t=q.value.toLowerCase();let list=P.filter(p=>(f==='all'||p.cat.includes(f))&&(`${p.name} ${p.desc} ${p.stack.join(' ')}`.toLowerCase().includes(t)));grid.innerHTML=list.map(p=>`<article class="card" onclick="show('${p.id}')"><div class="top"><div class="n">${p.n}</div><div class="status ${p.cls}">${p.status}</div></div><h3>${p.name}</h3><p>${p.desc}</p><div class="tags">${p.stack.map(x=>`<span class="tag">${x}</span>`).join('')}</div></article>`).join('')}function show(id){let p=P.find(x=>x.id===id);detail.className='detail show';detail.innerHTML=`<div class="eyebrow">PROJETO SELECIONADO</div><h2>${p.name}</h2><p>${p.desc} O objetivo é conectar indicador, contexto de negócio e ação operacional.</p><div class="actions">${p.actions.map(a=>`<span class="action">${a}</span>`).join('')}</div>`}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('on'));b.classList.add('on');f=b.dataset.f;render()});q.oninput=render;render();
</script></body></html>
